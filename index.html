<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CE 210 - WAQTC Progress Tracker</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <style>
        body {font-family: Arial, sans-serif; margin:20px;}
        .status {padding:10px; margin:10px 0; border-radius:8px; font-weight:bold;}
        .success {background:#d4edda; color:#155724;}
        .error {background:#f8d7da; color:#721c24;}
    </style>
</head>
<body>
    <h1>🔍 Firebase Debug Mode</h1>
    <div id="status"></div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyApz5GMmNmdSfdnzccx6tLlv-OCs8J4apg",
            authDomain: "ce210-progress.firebaseapp.com",
            databaseURL: "https://ce210-progress-default-rtdb.firebaseio.com",
            projectId: "ce210-progress",
            storageBucket: "ce210-progress.firebasestorage.app",
            messagingSenderId: "758989109332",
            appId: "1:758989109332:web:cea35e5fdad138398795c1"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const progressRef = db.ref('ce210Progress');

        const statusDiv = document.getElementById('status');

        statusDiv.innerHTML += `<div class="status success">✅ Firebase Connected Successfully!</div>`;

        // Try to read data
        progressRef.once('value')
            .then((snapshot) => {
                const data = snapshot.val();
                statusDiv.innerHTML += `<div class="status success">✅ Successfully read from Database<br>Current records: ${data ? data.length : 0}</div>`;
                console.log("Firebase Data:", data);
            })
            .catch((error) => {
                statusDiv.innerHTML += `<div class="status error">❌ Error reading from Database: ${error.message}</div>`;
                console.error(error);
            });

        // Test writing
        window.testSave = function() {
            progressRef.set([{name: "Test Student", tests: {}}]).then(() => {
                statusDiv.innerHTML += `<div class="status success">✅ Test write successful!</div>`;
            }).catch(err => {
                statusDiv.innerHTML += `<div class="status error">❌ Write failed: ${err.message}</div>`;
            });
        };
    </script>

    <button onclick="testSave()" style="padding:15px 25px; font-size:1.1em;">Test Save to Firebase</button>
</body>
</html>
