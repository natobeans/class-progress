  function playPing(){ if(!soundOn) return; ensureAudio(); if(!audioCtx) return; try{ var o=audioCtx.createOscillator(), g=audioCtx.createGain(), t=audioCtx.currentTime; o.type="sine"; o.frequency.setValueAtTime(880,t); o.frequency.exponentialRampToValueAtTime(1320,t+0.08); o.connect(g); g.connect(audioCtx.destination); g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.22,t+0.02); g.gain.exponentialRampToValueAtTime(0.0001,t+0.4); o.start(t); o.stop(t+0.42); }catch(e){} }

  function buildChain(student, sk){
    var back=[student], seen={}, cur=student, guard=0; seen[student]=1;
    while(guard++<40){ var r=(state.records[cur]||{})[sk], c=r&&r.coachedBy; if(!c||c==="—") break; if(c==="Instructor"||c==="TA"){ back.unshift(c); break; } if(seen[c]) break; seen[c]=1; back.unshift(c); cur=c; }

      '<div><label class="fld">Instructor code (optional — locks Dashboard &amp; Setup)</label><input type="text" id="setCode" value="'+esc(state.config.instructorCode)+'"></div></div>'+
      '<div style="margin-top:16px"><button class="btn primary" id="saveSetup">Save setup</button> <button class="btn" id="clearRecs" style="margin-left:8px">Clear records (keep roster)</button> <button class="btn danger" id="eraseAll" style="margin-left:8px">Erase everything</button></div>'+
      '<p class="muted" style="margin-top:10px">Storage mode: <b>'+(Store.mode()==="shared"?"shared (everyone with the link shares one dataset)":"local (this browser only)")+'</b>. Only students who have <b>passed off</b> a skill (plus Instructor / TA) appear as eligible coaches or proctors for it.</p></div>';
    app.innerHTML=html;
    document.getElementById("saveSetup").addEventListener("click", async function(){
      state.className=document.getElementById("setTitle").value||state.className;
      state.roster=document.getElementById("setRoster").value.split("\n").map(function(s){return s.trim();}).filter(Boolean);
      state.skills=document.getElementById("setSkills").value.split("\n").map(function(s){return s.trim();}).filter(Boolean);
      state.staff=document.getElementById("setStaff").value.split("\n").map(function(s){return s.trim();}).filter(Boolean);
      state.config.ecPerCoach=parseFloat(document.getElementById("setECc").value)||0;
      state.config.ecPerProctor=parseFloat(document.getElementById("setECp").value)||0;
      state.config.instructorCode=document.getElementById("setCode").value.trim();
      var raw=await Store.get(DATA_KEY); if(raw){ try{ var latest=ensureShape(JSON.parse(raw)); state.records=latest.records; }catch(e){} }
      await saveAll(); document.getElementById("title").textContent=state.className; alert("Saved."); renderSetup();
    });
    document.getElementById("clearRecs").addEventListener("click", async function(){ if(confirm("Clear all pass-off records but KEEP the roster and skills?")){ state.records={}; await saveAll(); selectedStudent=""; manualStudent=""; renderSetup(); } });
    document.getElementById("eraseAll").addEventListener("click", async function(){ if(confirm("Erase EVERYTHING (roster, skills, and records)?")){ state=ensureShape({}); await saveAll(); selectedStudent=""; manualStudent=""; renderSetup(); } });
  }

  function render(){ document.getElementById("title").textContent=state.className;
    if(currentView==="student") renderStudent();
    else if(currentView==="queues") renderQueues();
    else if(currentView==="dashboard") renderDashboard();
    else renderSetup();
    pingCheck();
  }
  function setActive(){ Array.prototype.forEach.call(document.querySelectorAll(".tab"),function(t){ t.classList.toggle("active", t.getAttribute("data-view")===currentView); }); }

  // delegated events (attached once)
  app.addEventListener("click", function(e){ ensureAudio(); var b=e.target.closest&&e.target.closest("[data-act]"); if(!b) return; var kind=b.getAttribute("data-act"), stu=b.getAttribute("data-student"), sk=b.getAttribute("data-skill"), who=""; var sel=b.getAttribute("data-sel"); if(sel){ var el=document.getElementById(sel); who=el?el.value:""; } else if(b.getAttribute("data-who")){ who=b.getAttribute("data-who"); } act(kind,stu,sk,who); });
  app.addEventListener("change", function(e){ var el=e.target, ch=el.getAttribute&&el.getAttribute("data-change"); if(!ch) return;
    if(ch==="whoami"){ selectedStudent=el.value; lastActiveSel=activeForStudent(selectedStudent); render(); }
    else if(ch==="manualpick"){ manualStudent=el.value; render(); }
    else if(ch==="manual"){ var stu=el.getAttribute("data-student"), sk=el.getAttribute("data-skill"), f=el.getAttribute("data-f"); var r=getR(stu,sk); r[f]=el.value; if(f==="passedOffBy"&&el.value!=="—"&&!r.date){ var d=new Date(); r.date=(d.getMonth()+1)+"/"+d.getDate(); } saveStudentRecord(stu).then(render); }
  });
  Array.prototype.forEach.call(document.querySelectorAll(".tab"),function(t){ t.addEventListener("click",function(){ ensureAudio(); currentView=this.getAttribute("data-view"); setActive(); render(); }); });
  document.getElementById("refreshBtn").addEventListener("click", async function(){ await loadAll(); render(); });
  document.getElementById("soundBtn").addEventListener("click", function(){ soundOn=!soundOn; this.textContent="🔔 Sound: "+(soundOn?"on":"off"); ensureAudio(); if(soundOn) playPing(); });

  // gentle live refresh for the coordination views
  setInterval(async function(){ if(currentView!=="queues"&&currentView!=="student") return; var ae=document.activeElement; if(ae&&/^(SELECT|INPUT|TEXTAREA)$/.test(ae.tagName)) return; await loadAll(); render(); }, 9000);

  (async function(){ var mb=document.getElementById("modebar"); await loadAll(); lastWait=waitingCount();
    if(Store.mode()==="shared"){ mb.className="modebar mode-shared"; mb.innerHTML="<b>Shared mode:</b> everyone who opens this link sees and updates the same queues and data. (Name selection is honor-system — no passwords.)"; }
    else { mb.className="modebar mode-local"; mb.innerHTML="<b>Local mode:</b> data is saved in <i>this browser only</i> — perfect as a single pass-off station. To sync across devices, run it as a shared link."; }
    render();
  })();
})();
</script>
</body>
</html>
