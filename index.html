<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CE 210 - WAQTC Progress Tracker</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap');
        body {font-family: 'Roboto', Arial, sans-serif; background: linear-gradient(135deg, #f0f4f8, #e0e9f2); margin:0; padding:20px; color:#333;}
        .container {max-width:1400px; margin:0 auto; background:white; border-radius:16px; box-shadow:0 10px 40px rgba(0,0,0,0.12); overflow:hidden;}
        header {background:linear-gradient(90deg,#1e3a8a,#3b82f6); color:white; padding:40px 20px; text-align:center;}
        .content {padding:30px;}
        .controls {text-align:center; margin:20px 0;}
        button {padding:12px 24px; font-size:1.1em; margin:0 8px; border:none; border-radius:8px; cursor:pointer;}
        .save-btn {background:#22c55e; color:white;}
        .reset-btn {background:#ef4444; color:white;}
        .status {padding:10px; margin:10px 0; border-radius:8px; background:#f0f9ff;}
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🧪 CE 210 Materials Lab</h1>
            <p class="subtitle">Live Shared WAQTC Progress Tracker</p>
        </header>

        <div class="content">
            <div class="controls">
                <button class="save-btn" onclick="saveProgress()">💾 SAVE ALL CHANGES</button>
                <button class="reset-btn" onclick="resetToDefault()">🔄 Reset to Initial Data</button>
            </div>
            <div id="status" class="status"></div>

            <h2>🏆 Class Leaderboard</h2>
            <div id="leaderboard">Loading...</div>

            <h2>📋 Progress Table</h2>
            <div class="table-wrapper" style="overflow-x:auto; border:1px solid #ddd; border-radius:8px;">
                <table id="progress-table">
                    <thead id="table-header"></thead>
                    <tbody id="table-body"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyApz5GMmNmdSfdnzccx6tLlv-OCs8J4apg",
            authDomain: "ce210-progress.firebaseapp.com",
            databaseURL: "https://ce210-progress-default-rtdb.firebaseio.com",
            projectId: "ce210-progress",
            storageBucket: "ce210-progress.firebasestorage.app",
            messagingSenderId: "758989109332",
            appId: "1:758989109332:web:cea35e5fdad138398795c1"
        };

        firebase.initializeApp(firebaseConfig);
        const progressRef = firebase.database().ref('ce210Progress');

        const testOrder = ["R90 Sampling","R76 Reducing","T27/T11 Gradation","T255 Moisture","T85 Spec Gravity","T335 Fracture","T176 Sand Eq","T99/T180 Proctor","R75 Family Curves","T265 Soil Moisture","TM2 Sampling","T309 Temp","T119 Slump","T121 Density","T152 Air Content","R100 Cylinders"];

        let students = [];

        const defaultStudents = [ /* full array - same as before */ 
            { name: "James Benner", tests: { "R90 Sampling":1, "R76 Reducing":1, "T27/T11 Gradation":1, "T255 Moisture":0, "T85 Spec Gravity":1, "T335 Fracture":0, "T176 Sand Eq":1, "T99/T180 Proctor":1, "R75 Family Curves":0, "T265 Soil Moisture":1, "TM2 Sampling":1, "T309 Temp":1, "T119 Slump":0, "T121 Density":1, "T152 Air Content":0, "R100 Cylinders":1 }},
            { name: "Joshua Christensen", tests: { "R90 Sampling":1, "R76 Reducing":1, "T27/T11 Gradation":1, "T255 Moisture":1, "T85 Spec Gravity":1, "T335 Fracture":1, "T176 Sand Eq":1, "T99/T180 Proctor":1, "R75 Family Curves":1, "T265 Soil Moisture":1, "TM2 Sampling":1, "T309 Temp":1, "T119 Slump":1, "T121 Density":1, "T152 Air Content":1, "R100 Cylinders":1 }},
            { name: "Mfundo Dlamini", tests: { "R90 Sampling":1, "R76 Reducing":0, "T27/T11 Gradation":1, "T255 Moisture":1, "T85 Spec Gravity":0, "T335 Fracture":1, "T176 Sand Eq":1, "T99/T180 Proctor":1, "R75 Family Curves":0, "T265 Soil Moisture":1, "TM2 Sampling":1, "T309 Temp":1, "T119 Slump":1, "T121 Density":0, "T152 Air Content":1, "R100 Cylinders":1 }},
            { name: "Abbey Eichmann", tests: { "R90 Sampling":1, "R76 Reducing":1, "T27/T11 Gradation":1, "T255 Moisture":1, "T85 Spec Gravity":1, "T335 Fracture":1, "T176 Sand Eq":0, "T99/T180 Proctor":1, "R75 Family Curves":1, "T265 Soil Moisture":1, "TM2 Sampling":1, "T309 Temp":0, "T119 Slump":1, "T121 Density":1, "T152 Air Content":1, "R100 Cylinders":1 }},
            { name: "Eduarda Iunes", tests: { "R90 Sampling":0, "R76 Reducing":1, "T27/T11 Gradation":1, "T255 Moisture":1, "T85 Spec Gravity":1, "T335 Fracture":1, "T176 Sand Eq":1, "T99/T180 Proctor":0, "R75 Family Curves":1, "T265 Soil Moisture":1, "TM2 Sampling":1, "T309 Temp":1, "T119 Slump":1, "T121 Density":1, "T152 Air Content":0, "R100 Cylinders":1 }},
            { name: "Ammon Obbanya", tests: { "R90 Sampling":1, "R76 Reducing":1, "T27/T11 Gradation":0, "T255 Moisture":1, "T85 Spec Gravity":1, "T335 Fracture":1, "T176 Sand Eq":1, "T99/T180 Proctor":1, "R75 Family Curves":1, "T265 Soil Moisture":1, "TM2 Sampling":1, "T309 Temp":1, "T119 Slump":1, "T121 Density":1, "T152 Air Content":1, "R100 Cylinders":0 }},
            { name: "Gadiel Perez", tests: { "R90 Sampling":1, "R76 Reducing":1, "T27/T11 Gradation":1, "T255 Moisture":1, "T85 Spec Gravity":1, "T335 Fracture":0, "T176 Sand Eq":1, "T99/T180 Proctor":1, "R75 Family Curves":0, "T265 Soil Moisture":1, "TM2 Sampling":1, "T309 Temp":1, "T119 Slump":0, "T121 Density":1, "T152 Air Content":1, "R100 Cylinders":1 }},
            { name: "Zee Vieira Fernandes", tests: { "R90 Sampling":1, "R76 Reducing":1, "T27/T11 Gradation":1, "T255 Moisture":0, "T85 Spec Gravity":1, "T335 Fracture":1, "T176 Sand Eq":1, "T99/T180 Proctor":1, "R75 Family Curves":1, "T265 Soil Moisture":0, "TM2 Sampling":1, "T309 Temp":1, "T119 Slump":1, "T121 Density":1, "T152 Air Content":1, "R100 Cylinders":1 }}
        ];

        function calculatePercent(s) {
            return Math.round(Object.values(s.tests).filter(v => v===1).length / testOrder.length * 100);
        }

        function renderAll() {
            // Leaderboard
            const sorted = [...students].sort((a,b) => calculatePercent(b) - calculatePercent(a));
            let lb = '';
            sorted.forEach((s,i) => {
                const pct = calculatePercent(s);
                const rank = i===0?'🏆 ':i===1?'🥇 ':i===2?'🥈 ':i===3?'🥉 ':'';
                lb += `<div style="background:#f8fafc;padding:18px;border-radius:12px;margin-bottom:12px;">
                    <div style="display:flex;justify-content:space-between;"><strong>${rank}${s.name}</strong><strong>${pct}%</strong></div>
                    <div style="height:38px;background:#e2e8f0;border-radius:999px;overflow:hidden;margin-top:8px;">
                        <div class="progress-bar" style="width:${pct}%">${pct}%</div>
                    </div>
                </div>`;
            });
            document.getElementById('leaderboard').innerHTML = lb;

            // Table (same as before)
            let header = `<tr><th>Student</th>`;
            testOrder.forEach(t => header += `<th>${t}</th>`);
            header += `</tr>`;
            document.getElementById('table-header').innerHTML = header;

            let body = '';
            students.forEach((s, i) => {
                body += `<tr><td class="student-name">${s.name}</td>`;
                testOrder.forEach(t => {
                    const checked = s.tests[t] ? 'checked' : '';
                    body += `<td><label class="toggle"><input type="checkbox" ${checked} onchange="toggleTest(${i},'${t}',this.checked)"><span class="slider"></span></label></td>`;
                });
                body += `</tr>`;
            });
            document.getElementById('table-body').innerHTML = body;
        }

        window.toggleTest = (i, test, val) => {
            students[i].tests[test] = val ? 1 : 0;
            renderAll();
        };

        window.saveProgress = () => {
            progressRef.set(students).then(() => {
                document.getElementById('status').innerHTML = "✅ Saved successfully!";
            });
        };

        window.resetToDefault = () => {
            if (confirm("Reset all data?")) {
                students = JSON.parse(JSON.stringify(defaultStudents));
                renderAll();
                saveProgress();
            }
        };

        // Main load
        progressRef.once('value', (snap) => {
            const data = snap.val();
            if (data && data.length) {
                students = data;
            } else {
                students = JSON.parse(JSON.stringify(defaultStudents));
            }
            renderAll();
        });
    </script>
</body>
</html>
